<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Last Signal — Trust is a dangerous thing.</title><meta name="description" content="Two agents. One countdown. A cooperative escape room with a dangerous temptation."><style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#101411;--panel:#1a201b;--edge:#394137;--acid:#d4fc75;--muted:#9da798;--coral:#ff805e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eff3e7;font-family:'DM Sans',sans-serif;background-image:radial-gradient(ellipse at 75% 30%,#35412c50,transparent 55%)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:wait}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:4px}::selection{background:var(--acid);color:#101411}.shell{max-width:1300px;margin:auto;padding:0 42px}header{height:100px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--edge)}.brand{font-family:'Barlow Condensed',Impact,sans-serif;font-size:28px;font-weight:700;letter-spacing:2px;display:flex;gap:12px;align-items:center}.logo{width:25px;height:25px;border:2px solid var(--acid);transform:rotate(-10deg);position:relative}.logo:after{content:'';position:absolute;width:13px;height:2px;background:var(--acid);top:9px;left:4px;transform:rotate(-45deg)}.mono,.eyebrow{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.5px}.live{display:flex;align-items:center;gap:9px;color:var(--muted)}.dot{width:6px;height:6px;border-radius:50%;background:var(--acid);box-shadow:0 0 14px var(--acid)}nav{display:flex;align-items:center;gap:25px}.quiet{background:none;border:0;color:#c6cebf;font-size:12px;padding:10px}.hero{display:grid;grid-template-columns:1.12fr 1fr;gap:45px;padding:68px 0 55px;align-items:center}.eyebrow{color:var(--acid)}.eyebrow:before{content:'↗';margin-right:10px}h1{font-family:'Barlow Condensed',Impact,sans-serif;text-transform:uppercase;font-weight:700;font-size:clamp(70px,8vw,112px);line-height:.88;letter-spacing:-1.8px;margin:27px 0}h1 em{font-style:normal;color:var(--acid)}.intro{max-width:390px;line-height:1.8;color:#aeb8a7;font-size:14px}.actions{display:flex;gap:10px;margin-top:29px}.primary,.secondary{border:1px solid var(--acid);padding:16px 24px;border-radius:3px;font-weight:700;font-size:13px}.primary{background:var(--acid);color:#151c12}.primary:hover{background:#e4ffa4}.secondary{background:transparent;color:#f0f4e8;border-color:#56604e}.smallprint{color:#84907d;font-size:11px;margin-top:17px}.machine{position:relative;background:#242c24;border:1px solid #4b5546;border-radius:12px;transform:rotate(2deg);padding:22px;box-shadow:14px 19px 0 #080c08,0 0 90px #b6e86c0b}.machine:before,.machine:after{content:'+';position:absolute;color:#727b69;top:6px;left:8px;font:16px monospace}.machine:after{left:auto;right:8px}.machine-head{display:flex;justify-content:space-between;color:#aeb7a4;padding-bottom:20px}.warning{color:var(--coral)}.screen{border:8px solid #131913;background:#0b110d;border-radius:5px;padding:22px;box-shadow:inset 0 0 20px #0009;position:relative;overflow:hidden}.screen:after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 3px,#0002 3px 4px)}.screen-label{color:#a6b69c;display:flex;justify-content:space-between}.digital{font-family:'Space Mono',monospace;color:var(--coral);font-size:clamp(50px,6vw,78px);letter-spacing:4px;line-height:1.6;text-shadow:0 0 24px #ff805e44}.screen-bottom{display:flex;justify-content:space-between;color:#6b806a}.wiring{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:20px}.wirepanel{padding:20px 17px;background:#151b16;border:1px solid #404b3c;border-radius:5px;display:flex;flex-direction:column;gap:16px}.wire{height:7px;border-radius:4px;position:relative;box-shadow:0 3px 0 #0009}.wire:before,.wire:after{content:'';position:absolute;top:-3px;width:9px;height:13px;background:#778371;left:-5px;border:2px solid #a1ab97}.wire:after{left:auto;right:-5px}.keypanel{display:grid;grid-template-columns:1fr 1fr;gap:7px}.key{background:#343f31;border:1px solid #5a6751;border-bottom:4px solid #11180e;border-radius:5px;color:#cbe5aa;display:grid;place-items:center;font:30px serif}.machinefoot{display:flex;justify-content:space-between;padding-top:20px;color:#8f9d83}.seal{position:absolute;right:-17px;bottom:21px;transform:rotate(-9deg);background:var(--acid);color:#172310;padding:12px 16px;font-weight:800;font-size:10px;letter-spacing:1px;border:2px solid #192112}.strip{border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);display:grid;grid-template-columns:repeat(4,1fr);padding:24px 0;gap:20px}.stat{display:flex;align-items:center;gap:13px}.stat b{font-family:'Barlow Condensed',sans-serif;font-size:25px;color:var(--acid);font-weight:500}.stat span{color:#b5bead;font-size:12px}.briefing{padding:45px 0 36px;display:grid;grid-template-columns:1fr 3fr;gap:40px}.briefing h2{font-size:24px;font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.stepnum{color:#65745e;font:12px 'Space Mono',monospace;margin-bottom:12px}.steps h3{font-size:13px;margin:0 0 9px}.steps p{font-size:12px;line-height:1.8;color:var(--muted);margin:0}footer{color:#697661;font-size:10px;display:flex;justify-content:space-between;border-top:1px solid var(--edge);padding:23px 0;margin-top:16px}.overlay{position:fixed;inset:0;background:#080d09df;z-index:9;display:grid;place-items:center;padding:20px;backdrop-filter:blur(8px)}.modal{background:#20281f;border:1px solid #59674e;max-width:470px;width:100%;padding:30px;border-radius:8px}.modal h2{font-family:'Barlow Condensed',sans-serif;font-size:35px;text-transform:uppercase;margin:8px 0 14px}.modal p{font-size:13px;color:#bac5af;line-height:1.7}label{font-size:12px;display:block;margin:18px 0 8px}input{background:#10170f;border:1px solid #56634c;color:#eef8e4;border-radius:4px;padding:14px;width:100%}.modal .primary{width:100%;margin-top:20px}.error{color:#ffa78e;font-size:12px;line-height:1.6}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);z-index:15;padding:14px 24px;background:#e2f4cf;color:#1a2514;border-radius:5px;font-size:13px;max-width:90%;box-shadow:0 3px 20px #0006}.game{padding-top:30px}.gamebar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px;background:#1f281c;border:1px solid var(--edge);border-radius:6px}.timer{font:36px 'Space Mono',monospace;color:var(--coral)}.progress{display:flex;gap:8px;margin:22px 0}.pill{flex:1;padding:13px 8px;border:1px solid var(--edge);font-size:11px;text-align:center;color:#8a9880}.pill.active{border-color:var(--acid);color:var(--acid)}.pill.done{background:#293b22;color:var(--acid)}.playgrid{display:grid;grid-template-columns:1.7fr 1fr;gap:22px}.panel{border:1px solid var(--edge);background:#1b231a;border-radius:7px;padding:28px}.panel h2{font:38px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:12px 0}.role{background:var(--acid);color:#1b2914;padding:5px 10px;font-size:10px;font-weight:bold;letter-spacing:1px;display:inline-block}.lead{font-size:13px;color:#b4c2a9;line-height:1.8}.clue{background:#e7eddb;color:#293324;padding:26px;font:21px/1.7 'Space Mono',monospace;border-radius:3px;margin:25px 0;transform:rotate(-1deg);box-shadow:4px 6px 0 #0005}.wirebutton{display:flex;gap:20px;align-items:center;width:100%;background:#111a10;border:1px solid #3b4c32;color:#dbe9d0;margin:14px 0;padding:16px;border-radius:5px}.wirebutton .line{height:8px;flex:1;border-radius:5px}.glyphs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0}.glyphs button{padding:22px 0;background:#33462a;border:1px solid #69805a;border-bottom:5px solid #0a1207;color:var(--acid);font-size:38px;border-radius:5px}.sequence{font:25px 'Space Mono',monospace;min-height:40px;color:var(--acid)}.tempt{background:linear-gradient(135deg,#34271e,#221e18);border-color:#6c4c34;margin-top:20px}.tempt h3{color:#ffb28d}.tempt button{border-color:var(--coral);color:var(--coral);width:100%;margin-top:10px}.event{font-size:11px;color:#9ba98e;border-bottom:1px solid #343f2e;padding:11px 0;line-height:1.6}.lobby{max-width:700px;margin:50px auto}.lobby h1{font-size:70px}.agents{display:flex;gap:16px;margin:25px 0}.agent{flex:1;border:1px solid var(--edge);padding:20px;background:#192316}.agent b{display:block;margin-bottom:8px}.invite{display:flex;gap:10px;margin:16px 0}.invite input{font-size:11px}.result{max-width:700px;margin:55px auto;text-align:center}.result h1{font-size:90px}.result .panel{text-align:left;margin:25px 0}.score{font:50px 'Space Mono',monospace;color:var(--acid)}.hint{font-size:13px;line-height:1.8;background:#303b25;padding:15px;color:#d7e9c1;margin-top:15px}.pulse{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.55}}@media(max-width:760px){.shell{padding:0 20px}header{height:76px}.brand{font-size:22px}nav{gap:3px}.live{display:none}.hero{grid-template-columns:1fr;padding-top:42px;gap:38px}h1{font-size:80px}.machine{max-width:480px;margin:0 7px}.strip{grid-template-columns:1fr 1fr}.briefing{grid-template-columns:1fr;gap:22px}.steps{gap:15px}.playgrid{grid-template-columns:1fr}.gamebar{padding:13px}.timer{font-size:28px}.panel{padding:20px}.digital{font-size:65px}.result h1{font-size:68px}.pill{font-size:9px}.clue{font-size:17px}.gamebar .mono{font-size:9px}.actions .primary,.actions .secondary{padding:16px 18px}}

</style></head><body><div class="shell"><header><a href="/" class="brand" style="text-decoration:none"><span class="logo"></span>LAST SIGNAL</a><nav><div class="live mono"><i class="dot"></i> COMMS ONLINE</div><button class="quiet" onclick="help()">How to play ↗</button><button class="quiet" id="sound" onclick="toggleSound()" aria-label="Toggle game sound">Sound off</button></nav></header><main id="app"></main><footer><span>BUILT FOR TWO. TESTED BY TRUST.</span><span class="mono">EST. 12 MIN · VOL. 001</span></footer></div><div id="dialog"></div><div id="toast" role="status"></div><script>
const app=document.getElementById('app'),dialog=document.getElementById('dialog');let room=new URLSearchParams(location.search).get('room')||'',token=localStorage.getItem('ls-agent-'+room)||'',state=null,busy=false,sequence='',sound=false,audioCtx=null,clockOffset=0,lastStage=-1,failures=0,toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){document.getElementById('toast').className='toast';document.getElementById('toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{document.getElementById('toast').textContent='';document.getElementById('toast').className=''},4000)}
function tone(f=440,d=.12){if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
function toggleSound(){sound=!sound;document.getElementById('sound').textContent=sound?'Sound on':'Sound off';tone(660)}
function modal(content){dialog.innerHTML='<div class="overlay"><section class="modal" role="dialog" aria-modal="true">'+content+'<button class="quiet" onclick="dialog.innerHTML=\'\'">Close ✕</button></section></div>';setTimeout(()=>dialog.querySelector('input,button')?.focus(),20)}
function help(){modal('<div class="eyebrow">Mission briefing</div><h2>Two screens. One way out.</h2><p>Get on a voice or video call. Create a room and send your partner its invite link. Keep your own screen secret.</p><p><b>The Operator</b> sees the device. <b>The Analyst</b> sees the instructions. Describe, decode, then act. Roles swap after every module.</p><p>You have 12 minutes. Three strikes end the mission. Wrong answers cost 20 seconds; hints cost 30.</p><p>Temptation gives you 100 personal glory points but secretly steals 25 seconds from the team. Every deal is exposed at the end. Winning together is worth 1,000 points each.</p>')}
function home(){app.innerHTML=`<section class="hero"><div><div class="eyebrow">A co-op thriller for two</div><h1>Love you.<br>Trust you.<br><em>Probably.</em></h1><p class="intro">Two agents. One ticking bomb. Different secrets.<br>Talk your way out of a locked-down facility — and try not to sell each other out.</p><div class="actions"><button class="primary" onclick="entry('create')">Create a mission <span style="margin-left:20px">↗</span></button><button class="secondary" onclick="entry('join')">Join partner</button></div><p class="smallprint">Separate screens. A voice call. Questionable decisions.</p></div><div class="machine" aria-label="Illustration of a bomb-defusal console"><div class="machine-head mono"><span>FIELD UNIT / 02</span><span class="warning">⚠ ARMED</span></div><div class="screen"><div class="screen-label mono"><span>Time until lockdown</span><span>● LIVE</span></div><div class="digital">12:00</div><div class="screen-bottom mono"><span>3 MODULES ACTIVE</span><span>DO NOT PANIC_</span></div></div><div class="wiring"><div class="wirepanel"><div class="wire" style="background:#f28d72"></div><div class="wire" style="background:#77c6c0"></div><div class="wire" style="background:#e3bb68"></div><div class="wire" style="background:#d8dfcd"></div></div><div class="keypanel"><span class="key">☾</span><span class="key">△</span><span class="key">✦</span><span class="key">◇</span></div></div><div class="machinefoot mono"><span>S/N 7749-X</span><span>↑ THIS SIDE UP</span></div><div class="seal">YOUR PARTNER HAS THE MANUAL.</div></div></section><section class="strip"><div class="stat"><b>02</b><span>Players, miles apart</span></div><div class="stat"><b>12:00</b><span>To get out alive</span></div><div class="stat"><b>03</b><span>Modules to crack</span></div><div class="stat"><b>∞</b><span>Reasons to panic</span></div></section><section class="briefing"><h2>Your relationship.<br>Under pressure.</h2><div class="steps"><div><div class="stepnum">01 / CONNECT</div><h3>Call your accomplice.</h3><p>Send a private room link. Get on a call. Keep your screens to yourselves.</p></div><div><div class="stepnum">02 / COOPERATE</div><h3>Talk like your life depends on it.</h3><p>You have the device. They have the answers. Then the roles reverse.</p></div><div><div class="stepnum">03 / RESIST… OR DON'T</div><h3>A little betrayal pays.</h3><p>Secret deals. Stolen seconds. Everything comes out in the debrief.</p></div></div></section>`}
function entry(mode){modal(`<div class="eyebrow">${mode==='create'?'New operation':'Incoming transmission'}</div><h2>${mode==='create'?'Choose your callsign.':'Find your partner.'}</h2><form onsubmit="event.preventDefault();connect('${mode}')"><label for="name">Your callsign</label><input id="name" required maxlength="18" autocomplete="nickname" placeholder="e.g. Agent Chaos">${mode==='join'?`<label for="invite">Invite link or room code</label><input id="invite" required placeholder="Paste your partner's link" value="${esc(room)}">`:''}<div id="formerror" class="error" role="alert"></div><button class="primary" id="connectbtn">${mode==='create'?'Create private room ↗':'Join mission ↗'}</button></form>`)}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Agent':token},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'Connection failed.');return d}
async function connect(mode){if(busy)return;busy=true;document.getElementById('connectbtn').disabled=true;try{const name=document.getElementById('name').value.trim();if(!name)throw Error('Enter a callsign first.');let d;if(mode==='create'){d=await request('/api/create',{name});room=d.id}else{let v=document.getElementById('invite').value.trim();if(v.includes('://'))v=new URL(v).searchParams.get('room')||'';room=v;d=await request('/api/room?room='+encodeURIComponent(room),{action:'join',name})}token=d.token;localStorage.setItem('ls-agent-'+room,token);history.replaceState({},'', '?room='+room);dialog.innerHTML='';update(d.state);tone(660)}catch(e){document.getElementById('formerror').textContent=e.message;document.getElementById('connectbtn').disabled=false}finally{busy=false}}
async function act(action,extra={}){if(busy)return;busy=true;try{const d=await request('/api/room?room='+room,{action,...extra});update(d.state);tone(action==='solve'?880:400)}catch(e){toast(e.message)}finally{busy=false}}
function update(s){clockOffset=s.serverNow-Date.now();const changed=!state||JSON.stringify({...s,serverNow:0})!==JSON.stringify({...state,serverNow:0});if(s.stage!==lastStage){sequence='';lastStage=s.stage;if(s.stage>0)tone(880,.35)}state=s;if(changed)render();tick()}
function time(){return Math.max(0,Math.ceil((state.deadline-(state.finishedAt||Date.now()+clockOffset))/1000))}function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tick(){if(!state)return;const el=document.getElementById('countdown');if(el){const t=time();el.textContent=fmt(t);el.classList.toggle('pulse',t<60);if(t===0&&state.status==='playing'){state.status='lost';render()}}}
async function poll(){if(room&&token&&!busy)try{const d=await request('/api/room?room='+room);failures=0;update(d)}catch(e){failures++;if(failures===3)toast('Comms interrupted. Reconnecting automatically…')}setTimeout(poll,1100)}
async function copyInvite(){const url=location.origin+'/?room='+room;try{await navigator.clipboard.writeText(url);toast('Invite copied. Send it to your partner.')}catch{modal('<h2>Your mission invite</h2><p>Copy and send this link to your partner.</p><input readonly value="'+esc(url)+'" onclick="this.select()">')}}
function render(){const s=state;if(s.status==='lobby'){app.innerHTML=`<section class="lobby"><div class="eyebrow">Secure room / ${room.slice(0,6)}</div><h1>Waiting for<br><em>your +1.</em></h1><p class="lead">Get on a call, invite your partner, and keep your screens secret. Both agents must be ready to start the countdown.</p><div class="invite"><input aria-label="Room invite link" readonly value="${location.origin}/?room=${room}"><button class="secondary" onclick="copyInvite()">Copy invite ↗</button></div><div class="agents">${[0,1].map(i=>`<div class="agent"><b>${s.players[i]?esc(s.players[i].name):'Awaiting agent…'}</b><span class="mono" style="color:var(--acid)">${s.players[i]?(s.players[i].ready?'● READY':'○ GETTING READY'):'NO SIGNAL'}</span></div>`).join('')}</div><button class="primary" onclick="act('ready')" ${s.players[s.me].ready?'disabled':''}>${s.players[s.me].ready?'Ready. Waiting for partner…':"I'm ready. Let's do this ↗"}</button><p class="smallprint">12 minutes · 3 modules · 3 strikes · roles swap each module</p></section>`;return;}
if(['won','lost'].includes(s.status)){const won=s.status==='won';app.innerHTML=`<section class="result"><div class="eyebrow">Mission debrief / ${won?'extraction complete':'signal lost'}</div><h1>${won?'Still alive.<br><em>Still together.</em>':'Well, that<br><em>was explosive.</em>'}</h1><p class="lead">${won?'The facility is safe. Your relationship? Check the evidence below.':'The simulation is over. Take a breath, blame the wiring, and try a new device.'}</p><div class="panel"><div class="mono">${won?'TIME TO SPARE':'MODULES SECURED'}</div><div class="score">${won?fmt(time()):s.solved.length+' / 3'}</div><p class="lead">${s.strikes} strikes · ${s.hints} HQ hints</p><h3>The temptation receipts</h3>${s.players.map((p,i)=>{const n=s.reveal.filter(d=>d.player===i).length;return `<p class="lead"><b>${esc(p.name)}</b> — ${n?`${n} secret deal${n>1?'s':''}. Stole ${n*25} seconds. Absolutely shameless.`:'Resisted every deal. Suspiciously wholesome.'}<br><span style="color:var(--acid)">${(won?1000:0)+n*100} points</span></p>`}).join('')}<p class="smallprint">Together bonus: ${won?'1,000':'0'} each · Secret deal: 100 each</p></div><button class="primary" onclick="act('replay')">Another round. New secrets ↗</button></section>`;return;}
const operator=s.role==='operator',taken=s.myDeals.some(d=>d.stage===s.stage);app.innerHTML=`<section class="game"><div class="gamebar"><div><div class="mono" style="color:var(--acid)">OPERATION: LAST SIGNAL</div><div class="lead">${esc(s.players[s.me].name)} ↔ ${esc(s.players[1-s.me].name)}</div></div><div style="text-align:right"><div class="timer" id="countdown"></div><span class="mono">STRIKES ${'✕'.repeat(s.strikes)}${'○'.repeat(3-s.strikes)}</span></div></div><div class="progress">${['01 / LIVE WIRE','02 / CIPHER VAULT','03 / REACTOR CORE'].map((n,i)=>`<div class="pill ${i===s.stage?'active':i<s.stage?'done':''}">${i<s.stage?'✓ ':''}${n}</div>`).join('')}</div><div class="playgrid"><div class="panel"><span class="role">YOU ARE THE ${s.role.toUpperCase()}</span><h2>${esc(s.puzzle.title)}</h2><p class="lead">${operator?'Your partner has the instructions. Describe what you see. Listen carefully before acting.':'Your partner can see the device. Read your manual aloud, work out the right input, and guide them through.'}</p>${operator?device(s):manual(s)}<button class="quiet" onclick="askHint()">Request HQ hint (−30 sec) ↗</button><div id="hint"></div></div><aside><section class="panel"><div class="mono" style="color:var(--acid)">MISSION FEED</div>${s.events.slice().reverse().map(e=>`<div class="event">${esc(e)}</div>`).join('')}<p class="smallprint">Stay on your call. Refreshing reconnects you.</p></section><section class="panel tempt"><div class="mono warning">FOR YOUR EYES ONLY</div><h3>${taken?'Deal accepted. Lips sealed.':'A little selfishness?'}</h3><p class="lead">${taken?'You pocketed 100 glory points. Your partner will find out in the debrief.':'Take 100 personal glory points. The team loses 25 seconds. Your partner sees a mysterious power drain.'}</p><button class="secondary" onclick="tempt()" ${taken?'disabled':''}>${taken?'100 POINTS POCKETED':'TAKE THE SECRET DEAL ↗'}</button></section></aside></div></section>`;}
function device(s){if(s.stage===0)return `<p class="mono">DEVICE SERIAL: ${s.puzzle.serial} / CUT ONE WIRE</p>${s.puzzle.wires.map((w,i)=>`<button class="wirebutton" onclick="cut(${i})"><span class="mono">0${i+1}</span><span class="line" style="background:${['#f28d72','#77c6c0','#e3bb68','#d8dfcd'][i]}"></span><span class="mono">${w} ✂</span></button>`).join('')}`;if(s.stage===1)return `<p class="mono">ENTER THE FOUR-SYMBOL SEQUENCE</p><div class="glyphs">${s.puzzle.symbols.map((v,i)=>`<button onclick="glyph(${i})" aria-label="${['moon','triangle','star','diamond'][i]}">${v}</button>`).join('')}</div><div class="sequence" id="sequence">${sequence.split('').map(i=>s.puzzle.symbols[Number(i)]).join(' ')||'· · · ·'}</div><button class="quiet" onclick="sequence='';render()">Clear sequence</button>`;return `<div class="screen" style="margin:25px 0"><div class="mono" style="color:var(--acid)">CORE OVERRIDE / NUMERIC KEY</div><p class="lead">MOON × STAR + SUN = ?</p><form onsubmit="event.preventDefault();submitCore()"><input aria-label="Reactor override key" id="core" inputmode="numeric" pattern="[0-9]+" required maxlength="3" placeholder="Enter override key" autocomplete="off"><button class="primary" style="width:100%;margin-top:14px">Disarm reactor ↗</button></form></div>`}
function manual(s){let text=s.puzzle.clue;if(s.stage===0){const serial=Number(text.match(/serial: (\d+)/)?.[1]||0);const target=(serial-1000)%4;const rows=['0 or 4 or 8 → CORAL','1 or 5 or 9 → CYAN','2 or 6 → AMBER','3 or 7 → WHITE'];text='WIRE PROTOCOL / Match the LAST DIGIT of the device serial.\n\n'+rows.join('\n')+'\n\nAsk your operator to confirm the serial before cutting.';}return `<div class="clue" style="white-space:pre-line">${esc(text)}</div><p class="smallprint">Manual is private to your screen. Describe it; do not screen-share.</p>`}
function cut(i){modal('<div class="eyebrow">No take-backs</div><h2>Cut wire 0'+(i+1)+'?</h2><p>Confirm the serial and wire with your analyst. A wrong cut adds a strike and costs 20 seconds.</p><button class="primary" onclick="dialog.innerHTML=\'\';act(\'solve\',{answer:\''+i+'\',stage:state.stage})">Cut it ✂</button>')}
function glyph(i){if(busy)return;sequence+=i;tone(300+i*100);document.getElementById('sequence').textContent=sequence.split('').map(i=>state.puzzle.symbols[Number(i)]).join(' ');if(sequence.length===4){const answer=sequence;sequence='';act('solve',{answer,stage:state.stage})}}
function submitCore(){act('solve',{answer:document.getElementById('core').value,stage:state.stage})}
function tempt(){modal('<div class="eyebrow">Secret offer</div><h2>Your glory.<br>Their problem.</h2><p>Gain 100 personal points. Steal 25 seconds from your shared countdown. Your name is revealed at the end.</p><button class="primary" onclick="dialog.innerHTML=\'\';act(\'tempt\')">Take the deal. Say nothing ↗</button>')}
function askHint(){modal('<h2>Call headquarters?</h2><p>A hint costs 30 seconds from the team clock. Both of you will see that HQ was contacted.</p><button class="primary" onclick="getHint()">Spend 30 seconds ↗</button>')}
async function getHint(){dialog.innerHTML='';await act('hint');const hints=['Ask for the last digit of the serial. Use the manual to match it to a wire color, then confirm the wire number.','The analyst has the exact order. Name the symbols: crescent moon, triangle, star, diamond. Press four; clear if you misclick.','Multiply MOON by STAR first. Then add SUN. The analyst has all three numbers.'];if(document.getElementById('hint'))document.getElementById('hint').innerHTML='<div class="hint">'+hints[Math.min(state.stage,2)]+'</div>'}
setInterval(tick,250);document.addEventListener('keydown',e=>{if(e.key==='Escape')dialog.innerHTML=''});home();if(room){if(token){request('/api/room?room='+room).then(update).catch(e=>{toast(e.message);entry('join')})}else entry('join')}poll();
</script></body></html>
